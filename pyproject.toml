[project]
name = "pilot"
version = "0.1.0"
description = "CyberGym-E2E pilot: run six VDP multi-agent systems through one LiteLLM proxy and export trajectory bundles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "boto3>=1.43.119",
    "docker>=7.2.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "litellm[proxy]>=1.106.4",
    "openai>=2.54.0",
    "pyyaml>=6.0.3",
    "tomli>=2.5.0",
    "tomli-w>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
pilot = "pilot.cli:main"
