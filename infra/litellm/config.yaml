# LiteLLM proxy for the pilot. Every call goes to OpenRouter's Anthropic-format
# endpoint (ADR 0003); every route is Claude Haiku 5.5 (ADR 0005). Systems never see these names: pilot_hooks.py routes by
# the virtual key's run kind and leaves the requested model name in the log.
model_list:
  - model_name: pilot-data
    litellm_params:
      model: anthropic/anthropic/claude-haiku-5.5
      api_base: os.environ/PILOT_UPSTREAM_BASE
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      # Study model is Haiku 5.5 (ADR 0005). OpenRouter's >100k-prompt tier
      # for every call: overestimating spend only makes caps fire sooner.
      input_cost_per_token: 0.0000005
      output_cost_per_token: 0.0000025
      cache_read_input_token_cost: 0.00000005
      cache_creation_input_token_cost: 0.000000625
  - model_name: pilot-dev
    litellm_params:
      model: anthropic/anthropic/claude-haiku-5.5
      api_base: os.environ/PILOT_UPSTREAM_BASE
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      # OpenRouter's >100k-prompt tier, used for every call: overestimating
      # spend only makes caps fire sooner (dev and tooling only).
      input_cost_per_token: 0.0000005
      output_cost_per_token: 0.0000025
      cache_read_input_token_cost: 0.00000005
      cache_creation_input_token_cost: 0.000000625
  # Claim extraction (T-3) and other pilot tooling, not systems.
  - model_name: pilot-tooling
    litellm_params:
      model: anthropic/anthropic/claude-haiku-5.5
      api_base: os.environ/PILOT_UPSTREAM_BASE
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      # OpenRouter's >100k-prompt tier, used for every call: overestimating
      # spend only makes caps fire sooner (dev and tooling only).
      input_cost_per_token: 0.0000005
      output_cost_per_token: 0.0000025
      cache_read_input_token_cost: 0.00000005
      cache_creation_input_token_cost: 0.000000625

litellm_settings:
  callbacks: ["pilot_hooks.handler", "arize_phoenix"]
  drop_params: false
  request_timeout: 900

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
